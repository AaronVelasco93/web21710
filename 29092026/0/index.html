<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <!-- Este elemento sera modificado con JS -->
    <h1 id="titulo">Ejemplo de objetos con JS</h1>
    
    <!-- Parrafo que cambiaremos con JS -->
    <p id="mensaje" >Este texto lo podemos modificar con JS</p>

    <!-- input para capturar informacion -->
    <input type="text" id="nombre" placeholder="Escribe tu nombre" >

    <button id="btnMostrar" >Mostrar Nombre</button>
    <br><br>
    <!-- botones para modificar objetos DOM -->
    <button id="btnTitulo" >Cambiar titulo</button>
    <button id="btnColor">Cambiar color</button>
    <button id="btnAgregar" >Agregar</button>
    <button id="btnEliminar" >Eliminar</button>
    <!-- caja donde se agregaran elementos dinamicamente -->
     <div class="caja" >
        <h3>Elementos agregados</h3>
        <ul id="lista">
            <li>Elemento inicial</li>
        </ul>
     </div>


</body>
<script src="app.js"></script>
</html>
